name: ofc

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ofc-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Npgsql connection string, .NET env format. Set
      # ConnectionStrings__DefaultConnection in .env or the platform env.
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: ofc-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # No host port published. In Dokploy, add the domain and set the app's
    # target port to 80; Traefik routes https://newofc.almutasim.site to this
    # web container, which proxies /api and /health to the api service.
