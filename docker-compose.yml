name: ofc

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ofc-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # Npgsql connection string, .NET env format. Set
      # ConnectionStrings__DefaultConnection in .env or the platform env.
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection}
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: ofc-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Map the host port to the container's nginx (public HTTP). Default 8080
      # to avoid clashing with an existing reverse proxy on 80/443.
      - "${APP_HTTP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

# To have the API reach the existing Supabase PostgreSQL on this host over its
# internal Docker network, create an external network and join it:
#   docker network create newofc-supabase-a4zfac_default   # (already exists)
# then uncomment below and add `- supabase` to the api service networks.
#
# networks:
#   supabase:
#     external: true
