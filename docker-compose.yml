name: ofc

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ofc-demo-password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ofc-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=postgres;Username=postgres;Password=${DB_PASSWORD:-ofc-demo-password};SSL Mode=Disable
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Explicit development reset only: this seed deletes orders and accounts, which invalidates every
  # logged-in session (their user rows are recreated with new ids) on the next redeploy if run
  # automatically. Run it deliberately with: docker compose --profile dev-reset up seed
  seed:
    profiles: ["dev-reset"]
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:-ofc-demo-password}
    volumes:
      - ./seed-dev-data.sql:/seed.sql:ro
    entrypoint: ["sh", "-c"]
    command: ["until pg_isready -h db -U postgres -d postgres >/dev/null 2>&1; do sleep 2; done; psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /seed.sql"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: ofc-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  db-data:
