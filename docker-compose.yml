name: ofc

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      # No weak fallback: a deploy that forgets to set DB_PASSWORD now fails to start instead of
      # silently running with a publicly-known demo password (security review finding M8).
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file — see .env.example}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ofc-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      # SSL Mode=Prefer opportunistically encrypts the API<->Postgres link when the server supports it,
      # without breaking connectivity on a plain postgres:17-alpine image that has no TLS cert
      # configured (security review finding M11 — Disable never even attempts encryption).
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=postgres;Username=postgres;Password=${DB_PASSWORD:?Set DB_PASSWORD in your .env file — see .env.example};SSL Mode=Prefer
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g

  # Explicit development reset only: this seed deletes orders and accounts, which invalidates every
  # logged-in session (their user rows are recreated with new ids) on the next redeploy if run
  # automatically. Run it deliberately with: docker compose --profile dev-reset up seed
  seed:
    profiles: ["dev-reset"]
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file — see .env.example}
    volumes:
      - ./seed-dev-data.sql:/seed.sql:ro
    entrypoint: ["sh", "-c"]
    command: ["until pg_isready -h db -U postgres -d postgres >/dev/null 2>&1; do sleep 2; done; psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /seed.sql"]

  # Optional: realistic historical sales test data (orders/payments/shifts)
  # on top of the seed above. Opt-in and separate from it since it's for
  # testing reports/pagination, not needed for a normal dev reset.
  # Run with: docker compose --profile dev-reset run --rm seed-transactions
  seed-transactions:
    profiles: ["dev-reset"]
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      api:
        condition: service_healthy
    environment:
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your .env file — see .env.example}
    volumes:
      - ./seed-transactions-data.sql:/seed.sql:ro
    entrypoint: ["sh", "-c"]
    command: ["until pg_isready -h db -U postgres -d postgres >/dev/null 2>&1; do sleep 2; done; psql -h db -U postgres -d postgres -v ON_ERROR_STOP=1 -f /seed.sql"]

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: ofc-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256m
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  db-data:
